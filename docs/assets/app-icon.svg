<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="0.55" stop-color="#f05a1a"/>
      <stop offset="1" stop-color="#b8300c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe7d6"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#ffab00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#5a1500" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a1500" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="512" cy="540" r="330" fill="#ffffff" opacity="0.07"/>
  <circle cx="512" cy="540" r="255" fill="#ffffff" opacity="0.06"/>

  <g transform="translate(512 525) scale(0.84) translate(-512 -525)">
  <!-- sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.92" filter="url(#soft)">
    <path d="M234 420 Q205 455 205 500" stroke-width="40"/>
    <path d="M790 420 Q819 455 819 500" stroke-width="40"/>
    <path d="M144 400 Q110 440 110 500" stroke-width="32" opacity="0.55"/>
    <path d="M880 400 Q914 440 914 500" stroke-width="32" opacity="0.55"/>
  </g>

  <!-- bell -->
  <g filter="url(#shadow)">
    <path fill="url(#bell)" d="M512 232
      c-118 0 -206 92 -206 214
      v92
      c0 58 -24 102 -66 140
      c-20 18 -8 50 18 50
      h508
      c26 0 38 -32 18 -50
      c-42 -38 -66 -82 -66 -140
      v-92
      c0 -122 -88 -214 -206 -214z"/>
    <rect x="484" y="196" width="56" height="62" rx="28" fill="url(#bell)"/>
    <path fill="url(#bell)" d="M436 762 a76 76 0 0 0 152 0z"/>
    <path fill="#ffffff" opacity="0.55" d="M380 430 c0 -70 40 -122 98 -140 c-36 34 -54 80 -54 140 v80 c0 18 -44 18 -44 0z"/>
  </g>

  <!-- notification badge -->
  <g filter="url(#soft)">
    <circle cx="700" cy="300" r="78" fill="url(#dot)"/>
    <circle cx="700" cy="300" r="78" fill="none" stroke="#ffffff" stroke-width="16"/>
  </g>
  </g>
</svg>
