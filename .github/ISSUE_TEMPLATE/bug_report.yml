name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Server / web interface, API, Mobile app (Android), Mobile app (iOS), Docker / deployment]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 (shown in GET /api/v1/info)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
