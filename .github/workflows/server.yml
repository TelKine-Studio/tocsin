name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

defaults:
  run:
    working-directory: server

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        database: ['sqlite', 'pgsql']
    name: PHP ${{ matrix.php }} · ${{ matrix.database }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tocsin
          POSTGRES_PASSWORD: tocsin
          POSTGRES_DB: tocsin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tocsin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, pdo_pgsql, pcntl, zip, gmp, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'tocsin_test' || ':memory:' }}
          DB_USERNAME: tocsin
          DB_PASSWORD: tocsin
